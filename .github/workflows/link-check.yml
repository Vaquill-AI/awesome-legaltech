name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --accept 200,206,202,401,403,429
            --exclude-loopback
            --exclude 'mailto:'
            --exclude 'localhost'
            --exclude 'pacer.uscourts.gov'
            --exclude 'indiankanoon.org'
            --exclude 'scdb.wustl.edu'
            --exclude 'legalweek.com'
            --exclude 'law.com'
            --exclude 'pro.bloomberglaw.com'
            --exclude 'capterra.com'
            --exclude 'g2.com'
            --exclude 'softwareadvice.com'
            --exclude 'getapp.com'
            --exclude 'lexisnexis.com'
            --exclude 'westlaw.com'
            --exclude 'store.law.com'
            --exclude 'nevo.co.il'
            --exclude 'portal.stf.jus.br'
            --exclude 'law.pku.edu.cn'
            --exclude 'glaw.scourt.go.kr'
            --exclude 'manupatra.com'
            --exclude 'free.law'
            --exclude 'clio.com'
            --exclude 'drata.com'
            --exclude 'main.knesset.gov.il'
            --exclude 'pakistancode.gov.pk'
            --exclude 'zakon.rada.gov.ua'
            --exclude 'gacetaoficialdebolivia.gob.bo'
            --exclude 'legislatie.just.ro'
            --exclude 'njt.hu'
            --exclude 'suin-juriscol.gov.co'
            --exclude 'spijweb.minjus.gob.pe'
            --exclude 'boe.gov.sa'
            --exclude 'gacetaoficial.gov.py'
            --exclude 'bdlaws.minlaw.gov.bd'
            --exclude 'dadosabertos.cnj.jus.br'
            --exclude 'pkulaw.com'
            --exclude 'impo.com.uy'
            --exclude 'elibrary.judiciary.gov.ph'
            --exclude 'almeezan.qa'
            --exclude 'sgg.gov.ma'
            --exclude 'adilet.zan.kz'
            --exclude 'vbpl.vn'
            --exclude 'nn.hr'
            --exclude 'caict.ac.cn'
            --exclude 'lawgeex.com'
            --exclude 'globallegalhackathon.com'
            --timeout 30
            --max-retries 3
            README.md
          fail: ${{ github.event_name != 'schedule' }}
          output: ./lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing report issue
        id: find
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label 'broken link' \
            --search 'in:title "Link Check Report"' \
            --limit 1 \
            --json number \
            --jq '.[0].number // ""')
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            echo "Will update existing issue #$number"
          else
            echo "No open report issue; a new one will be created"
          fi

      - name: Create issue from scheduled run
        if: >-
          github.event_name == 'schedule' &&
          github.event.repository.has_issues &&
          steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          issue-number: ${{ steps.find.outputs.issue_number }}
          title: 'Link Check Report - broken links found'
          content-filepath: ./lychee-report.md
          labels: |
            broken link
            maintenance
